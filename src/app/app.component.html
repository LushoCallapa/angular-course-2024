<div class="city-input-container">
  <input [(ngModel)]="newCityName" placeholder="Ingrese el nombre de la ciudad" class="city-input" />
  <button (click)="handleAddCity()" class="add-city-button">Añadir Ciudad</button>
</div>

<div class="container">
  <div class="item-wrapper" *ngFor="let city of citiesList">
    <item [city]="city" 
    (deleteCityOutput)="handleDeleteCity($event)"></item>
  </div>
</div>
